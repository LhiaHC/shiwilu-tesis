[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiwilu"
version = "1.0.0"
description = "Corpus de intenciones comunicativas para la lengua shiwilu (jebero, ISO 639-3: jeb)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lhía Antonella Hurtado Claros" }]
keywords = ["shiwilu", "jebero", "corpus", "lenguas amazonicas", "clasificacion de intenciones"]

dependencies = [
    "pandas>=2.0.0",
]

[project.optional-dependencies]
# Fase 1 — construccion del corpus (requiere clave de API)
fase1 = [
    "anthropic>=0.40.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
]
# Fase 2 — analisis del corpus (no requiere clave de API)
fase2 = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
]
# Fase 3 — baseline de clasificacion: LaBSE congelado + Regresion Logistica
fase3 = [
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "sentence-transformers>=3.0.0",
]
# Fase 4 — tecnicas de aumento de datos (OE2, R5/R6)
fase4 = [
    "numpy>=1.24.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "sentencepiece>=0.2.0",
    "transformers>=4.40.0",
    "peft>=0.11.0",
    "torch>=2.0.0",
]

[tool.setuptools]
packages = ["shiwilu"]
